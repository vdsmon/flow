# Canonical stage definitions.
# Single source of truth. Dispatcher reads opaquely; adding a stage = append entry + drop
# a reference doc under references/stage-<name>.md. Zero dispatcher code change.
#
# Closed vocabulary: stage names are fixed here. A pipeline selects from them; it
# cannot introduce a new stage NAME without a registry change.
#
# Field semantics:
#   name                          - matches references/stage-<name>.md and pipeline.stages entries
#   default_handler               - one of: "inline" | "subagent:<type>" | "none"
#   default_timeout_min           - basis for the run-lease TTL (dispatch_stage.py
#                                   _LEASE_TTL_MULTIPLIER x this); NOT an enforced stage deadline
#   required_predecessors         - upstream stages that MUST appear earlier in pipeline.stages
#   required_fields               - ticket-frontmatter keys that MUST be present for this stage;
#                                   parsed by _registry.py, consumed by lint_ticket.py to gate the
#                                   stage on frontmatter (the HARD GATE the gated stages run)
#   required_when_compounding     - if true AND [memory] compounding=true, MUST appear
#   reference_doc                 - path relative to this skill dir; loaded by inline handler
#   roles                         - open-ended list round-tripped into the dispatch descriptor
#                                   (dispatch_stage.py); the dispatcher does NOT enforce them, a
#                                   handler or pre-handler hook keys off a role string. Live reader:
#                                   records_diff_baseline (implement pre-handler hook, SKILL.md).
#   agent_defaults.<role>         - {tier, effort} defaults for a LAUNCH role. Distinct from
#                                   `roles` above, which are dispatch markers: "role" means two
#                                   different things in flow and these must never be merged.
#                                   A workspace [models] entry overrides; "off" opts out entirely.
#
# Timeouts for plan / code_review / e2e / commit / create_pr / review_loop
# are inferred defaults (the plan only specified ticket, implement, reflect explicitly).

# Tier -> model name, per harness. Two tiers only. A model rename edits this table rather
# than every stage entry. Identifiers are FULL: a bare "sol" is not a Codex model name, and
# a rejected -m does not fail loudly (the reviewer retries without it), so a wrong value
# here silently disables the policy. The Codex names are validated against the real CLI in
# a Codex-authenticated CI gate, never at init (which can only probe PATH, not acceptance).
[tiers.claude-code]
standard = "sonnet"
deep = "opus"

[tiers.codex]
standard = "gpt-5.6-terra"
deep = "gpt-5.6-sol"

[[stage]]
name = "ticket"
description = "Resolve ticket key, fetch ticket context via tracker"
default_handler = "inline"
default_timeout_min = 5
required_predecessors = []
required_when_compounding = false
reference_doc = "references/stage-ticket.md"
roles = []

[[stage]]
name = "plan"
description = "Architect plan, return for approval"
default_handler = "inline"
default_timeout_min = 10
required_predecessors = ["ticket"]
required_when_compounding = false
reference_doc = "references/stage-plan.md"
roles = []

[stage.agent_defaults.assessor]
tier = "deep"
effort = "medium"    # CALLER site: prefers the Codex assessor, so effort is carriable

[[stage]]
name = "implement"
description = "Code + unit tests in the ticket worktree; the handler reports only when green"
default_handler = "subagent:general-purpose"
default_timeout_min = 30
required_predecessors = ["ticket"]
required_fields = ["planned_files"]
required_when_compounding = false
reference_doc = "references/stage-implement.md"
roles = ["records_diff_baseline"]

[stage.agent_defaults.implementer]
tier = "standard"
# no effort: always host-native here, and the Agent tool CALL carries no effort
# parameter, so a resolved value would be dropped. Pinned in the agent frontmatter instead.

[[stage]]
name = "code_review"
description = "A fresh native reviewer challenges the implementation diff"
default_handler = "inline"
default_timeout_min = 15
required_predecessors = ["implement"]
required_when_compounding = false
reference_doc = "references/stage-code_review.md"
roles = []

[stage.agent_defaults.reviewer]
tier = "deep"
effort = "medium"    # HANDLER site: Codex when the bundled reviewer is wired

[stage.agent_defaults.fixer]
tier = "standard"
# no effort: the fixer is always native (stage-code_review.md step 4)

[[stage]]
name = "e2e"
description = "Observe the change behaving end-to-end; disable only by wiring e2e = \"none\""
default_handler = "subagent:general-purpose"
default_timeout_min = 30
required_predecessors = ["code_review"]
required_fields = ["e2e_recipe"]
required_when_compounding = false
reference_doc = "references/stage-e2e.md"
roles = []

[stage.agent_defaults.runner]
tier = "standard"
# no effort: native launch, see implement above

[[stage]]
name = "commit"
description = "Compose the conventional commit under the content-ownership gate (compose_commit.py)"
default_handler = "inline"
default_timeout_min = 5
required_predecessors = ["implement"]
required_fields = ["commit_type", "commit_summary"]
required_when_compounding = false
reference_doc = "references/stage-commit.md"
roles = []

[[stage]]
name = "create_pr"
description = "Push + open-or-resolve the PR through the forge seam (create_pr.py); bare default skips"
default_handler = "none"
default_timeout_min = 20
required_predecessors = ["commit"]
required_when_compounding = false
reference_doc = "references/stage-create_pr.md"
roles = []

[[stage]]
name = "review_loop"
description = "Bounded CI wait + at most one fix pass through the forge seam (forge_cli.py); bare default skips"
default_handler = "none"
default_timeout_min = 60
required_predecessors = ["create_pr"]
required_when_compounding = false
reference_doc = "references/stage-review_loop.md"
roles = []

[stage.agent_defaults.fixer]
tier = "standard"
# no effort: native launch, see implement above

[[stage]]
name = "review_brief"
description = "Local review companion (review_brief.py); no human gate, Forge stays the formal surface"
default_handler = "inline"
default_timeout_min = 10
required_predecessors = ["create_pr"]
required_when_compounding = false
reference_doc = "references/stage-review_brief.md"
roles = []

[stage.agent_defaults.author]
tier = "standard"
# no effort: native launch, see implement above

[[stage]]
name = "reflect"
description = "Closing-phase knowledge extraction; zero novel entries is success, not failure"
default_handler = "inline"
default_timeout_min = 5
required_predecessors = []
required_when_compounding = true
reference_doc = "references/stage-reflect.md"
roles = []
