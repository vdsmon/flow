# .flow/workspace.toml — generated by Flow workspace setup
# generated_at = '2026-07-26T03:30:10Z'

[tracker]
backend = "jira"

[tracker.jira]
cloud_id = "x"
project_key = "FT"

[pipeline]
stages = ["ticket", "plan", "implement", "code_review", "e2e", "commit", "create_pr", "review_loop", "review_brief", "reflect"]

[pipeline.handlers]
ticket = "inline"
plan = "inline"
implement = "subagent:general-purpose"
code_review = "inline"
e2e = "subagent:general-purpose"
commit = "inline"
create_pr = "none"
review_loop = "none"
review_brief = "inline"
reflect = "inline"

[memory]
namespace = "FT"
label_facets = []
compounding = true

