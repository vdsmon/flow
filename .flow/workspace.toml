# .flow/workspace.toml — generated by /flow init
# generated_at = '2026-06-03T14:02:43Z'

[tracker]
backend = "beads"

[tracker.beads]
prefix = "flow"

# Freeze lifted 2026-07-27: the simplification and reframing passes landed
# (PR #554/#555/#560/#561), so this repo targets itself for self-evolution again.
[maintainer]
self_target = true

[evolve]
cap = 10
concurrency = 8
# Maintainer decision 2026-07-27: a HOT leaf PR auto-merges in this self-target
# repo when the full gate holds (isolation + CI-green + agent diff review).
auto_merge_hot = true
# model tiering for spawned worker runs: fable for the interactive orchestrator, opus for spawned worker runs, sonnet for trivial.
worker_model = "opus"
adjudicate_hot = true

# Optional native-agent model hints. Unsupported hints inherit the owner session model.
[models]
implement = "sonnet"
code_review = "opus"
review_loop = "sonnet"

# This repo opens PRs ready for review (maintainer preference). The engine
# default is draft (create_pr.py returns true when this key is unset), so
# removing this override reverts to draft PRs.
[create_pr]
draft = false

# PR-host (forge) seam. This repo is on GitHub, so create_pr/review_loop drive the
# `gh` adapter. The block is optional (absent = no forge); github needs no sub-keys.
[forge]
backend = "github"

[forge.github]

[pipeline]
stages = ["ticket", "plan", "implement", "code_review", "commit", "create_pr", "review_loop", "reflect"]

[pipeline.handlers]
ticket = "inline"
plan = "inline"
implement = "subagent:general-purpose"
code_review = "inline"
commit = "inline"
create_pr = "inline"
review_loop = "inline"
reflect = "inline"

[reflect]
# Re-armed 2026-07-27: reflect is back in the pipeline and may repair the
# harness from inside a run (machinery_edit; flock-serialized, snapshot-aware).
machinery = true

[memory]
namespace = "flow"
compounding = false

[memory.semantic]
enabled = true
model = "BAAI/bge-small-en-v1.5"
