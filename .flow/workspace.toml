# .flow/workspace.toml — generated by /flow init
# generated_at = '2026-06-03T14:02:43Z'

[tracker]
backend = "beads"

[tracker.beads]
prefix = "flow"

[maintainer]
self_target = true

[triage]
# Self-target preference: a hot change ships on an advisor `proceed` like a
# non-hot one; the manager's merge-time guard-property review still backstops it.
adjudicate_hot = true

# No [models] block on purpose. stage-registry.toml now ships a default tier and effort
# for every launch role, so this workspace only needs an entry where it wants something
# DIFFERENT. It does not: every one of the seven sites resolved identically with and
# without the two hints that used to live here.
#
# Deleting them is not merely tidying. A literal pin is harness-independent, while a tier
# default follows whatever launches the agent — so the old `implement = "sonnet"` would
# have kept pinning a Claude model name even under a Codex harness, freezing this
# workspace against the tier map it now inherits.

# This repo opens PRs ready for review (maintainer preference). The engine
# default is draft (create_pr.py returns true when this key is unset), so
# removing this override reverts to draft PRs.
[create_pr]
draft = false

# PR-host (forge) seam. This repo is on GitHub, so create_pr/review_loop drive the
# `gh` adapter. The block is optional (absent = no forge); github needs no sub-keys.
[forge]
backend = "github"

[forge.github]

[pipeline]
stages = ["ticket", "plan", "implement", "code_review", "e2e", "commit", "create_pr", "review_loop", "reflect"]

[pipeline.handlers]
ticket = "inline"
plan = "inline"
implement = "subagent:flow:implementer"
code_review = "subagent:flow:codex-reviewer"
e2e = "subagent:flow:e2e-runner"
commit = "inline"
create_pr = "inline"
review_loop = "inline"
reflect = "inline"

[reflect]
# Reflect may repair the harness from inside a run (machinery_edit;
# flock-serialized, snapshot-aware).
machinery = true

[memory]
namespace = "flow"
compounding = true

[memory.semantic]
enabled = true
model = "BAAI/bge-small-en-v1.5"
